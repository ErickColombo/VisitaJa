<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisitaJá — Login</title>
    <style>
        :root {
            --primary: #155eef;
            --primary-dark: #0d47c9;
            --text: #172033;
            --muted: #667085;
            --background: #f8fafc;
            --border: #d0d5dd;
            --danger: #d92d20;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Inter, Arial, sans-serif;
            color: var(--text);
            background: var(--background);
        }

        .card {
            width: min(100%, 420px);
            padding: 32px;
            background: white;
            border: 1px solid #e4e7ec;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(16, 24, 40, 0.08);
        }

        .brand { margin: 0 0 8px; color: var(--primary); font-size: 24px; }
        h1 { margin: 0 0 8px; font-size: 28px; }
        .description { margin: 0 0 26px; color: var(--muted); }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: bold; }
        input {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font: inherit;
        }

        button {
            width: 100%;
            height: 46px;
            border: 0;
            border-radius: 8px;
            color: white;
            background: var(--primary);
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: var(--primary-dark); }
        .error { min-height: 20px; margin: 0 0 12px; color: var(--danger); font-size: 13px; }
        .back { display: block; margin-top: 18px; color: var(--muted); text-align: center; font-size: 13px; }
    </style>
</head>
<body>
<main class="card">
    <p class="brand">✓ VisitaJá</p>
    <h1>Entrar no painel</h1>
    <p class="description">Informe as credenciais do administrador.</p>

    <form id="login-form">
        <div class="form-group">
            <label for="username">Usuário</label>
            <input id="username" type="text" autocomplete="username" required>
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input id="password" type="password" autocomplete="current-password" required>
        </div>

        <p id="login-error" class="error"></p>
        <button type="submit">Entrar</button>
    </form>

    <a class="back" href="index.html">Voltar para a página inicial</a>
</main>

<script>
    const apiUrl = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:8080'
        : 'https://visitaja-server.onrender.com';

    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');

    if (sessionStorage.getItem('visitaja_token')) {
        window.location.replace('admin.html');
    }

    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginError.textContent = '';

        try {
            const response = await fetch(`${apiUrl}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });

            if (!response.ok) {
                loginError.textContent = 'Usuário ou senha inválidos.';
                return;
            }

            const data = await response.json();
            sessionStorage.setItem('visitaja_token', data.token);
            window.location.replace('admin.html');
        } catch (error) {
            loginError.textContent = 'Não foi possível conectar ao servidor.';
        }
    });
</script>
</body>
</html>
